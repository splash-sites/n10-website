<title>Numéro 10 Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600..900&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: the site's Roster look applied to a working tool. Black sidebar + content, condensed display only for page titles and numbers, Barlow for everything operated. State is shown with solid / outline / dim pills, no colour. */
:root{
  --bg:#000000;
  --surface:#121212;
  --raise:#1c1c1c;
  --line:#2b2b2b;
  --fg:#ffffff;
  --soft:#bdbdbd;
  --mute:#8a8a8a;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --text:"Barlow",ui-sans-serif,"Helvetica Neue",Arial,sans-serif;
  --noise:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='160' height='160'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/%3E%3CfeColorMatrix values='0 0 0 0 .5 0 0 0 0 .5 0 0 0 0 .5 0 0 0 .22 0'/%3E%3C/filter%3E%3Crect width='160' height='160' filter='url(%23n)'/%3E%3C/svg%3E");
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--text);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
p,h1,h2,h3,h4,ul{margin:0}
ul{padding:0;list-style:none}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.photo{background-color:#555;background-image:var(--noise),linear-gradient(var(--ang,160deg),var(--t1,#cfcfcf),var(--t2,#5d5d5d))}

.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.side{border-right:1px solid var(--line);padding:22px 14px 22px max(14px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:26px;position:sticky;top:0;height:100vh;overflow:auto}
.side .brand{display:flex;align-items:center;gap:10px;padding:0 8px}
.side .brand img{height:22px;filter:invert(1)}
.side .brand span{font-size:12px;color:var(--mute);border:1px solid var(--line);padding:1px 7px;border-radius:2px}
.side h4{font-size:12px;font-weight:500;color:var(--mute);padding:0 10px;margin-bottom:6px}
.side nav a{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-radius:3px;text-decoration:none;color:var(--soft);font-weight:500}
.side nav a:hover{background:var(--surface);color:var(--fg)}
.side nav a[aria-current="page"]{background:var(--fg);color:var(--bg)}
.side nav a .c{font-size:12px;font-variant-numeric:tabular-nums;color:inherit;opacity:.7}
.side nav a .dot{width:8px;height:8px;border-radius:50%;background:currentColor}
.side .me{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px;border-top:1px solid var(--line)}
.av{width:32px;height:32px;border-radius:50%;background:var(--fg);color:var(--bg);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.me p{font-size:13px;line-height:1.3}
.me small{color:var(--mute)}

.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:14px;height:64px;padding:0 max(24px,env(safe-area-inset-right,0px)) 0 28px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
.search{flex:1;max-width:420px;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:3px;padding:0 12px;height:38px}
.search input{background:none;border:0;outline:none;width:100%}
.search kbd{font-family:var(--text);font-size:11px;color:var(--mute);border:1px solid var(--line);border-radius:2px;padding:0 5px}
.top .sp{flex:1}
.menu{display:none;background:none;border:1px solid var(--line);border-radius:3px;height:38px;padding:0 12px;cursor:pointer}
.content{padding:32px max(24px,env(safe-area-inset-right,0px)) 80px 28px;max-width:1280px;width:100%}

.ph{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:24px}
.ph h1{font-family:var(--display);text-transform:uppercase;font-weight:800;font-size:clamp(2.5rem,5vw,3.75rem);line-height:.9}
.ph p{color:var(--mute);margin-top:8px}
.ph .acts{display:flex;gap:8px;flex-wrap:wrap}
.crumb{font-size:13px;color:var(--mute);margin-bottom:10px}
.crumb button{background:none;border:0;padding:0;color:var(--soft);cursor:pointer;text-decoration:underline;text-underline-offset:3px}

.btn{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 16px;border-radius:3px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;font-size:14px;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--mute)}
.btn.pri{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn.ghost{background:none}

.pill{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.on{background:var(--fg);color:var(--bg)}
.pill.out{border:1px solid var(--soft);color:var(--soft)}
.pill.dim{background:var(--raise);color:var(--mute)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:4px}
.panel > h3{font-size:14px;font-weight:600;padding:14px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px}
.panel > h3 small{font-weight:400;color:var(--mute)}
.pbody{padding:18px}

/* overview */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:12px}
.kpi{padding:16px 18px}
.kpi dt{font-size:13px;color:var(--mute)}
.kpi dd{margin:4px 0 0;font-family:var(--display);font-weight:800;font-size:2.5rem;line-height:1;font-variant-numeric:tabular-nums}
.kpi dd small{font-family:var(--text);font-size:13px;font-weight:500;color:var(--soft);margin-left:6px}
.two{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:12px;align-items:start}
.list li{display:flex;gap:14px;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:0}
.list .grow{flex:1;min-width:0}
.list .grow p:first-child{font-weight:600}
.list .grow p+p{font-size:13px;color:var(--mute)}
.bar{height:6px;background:var(--raise);border-radius:3px;overflow:hidden;width:120px;flex:none}
.bar i{display:block;height:100%;background:var(--fg)}
.quick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.quick .btn{justify-content:flex-start;height:46px}

/* tables */
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:12px}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg button{background:none;border:1px solid var(--line);border-radius:3px;padding:6px 12px;cursor:pointer;color:var(--soft);font-size:13px}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:820px}
th{text-align:left;font-size:12px;font-weight:500;color:var(--mute);padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:middle;font-variant-numeric:tabular-nums}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--raise)}
.handle{color:var(--mute);cursor:grab;width:28px;user-select:none}
.thumb{width:36px;height:46px;border-radius:2px;flex:none}
.who{display:flex;align-items:center;gap:12px}
.who b{display:block;font-weight:600}
.who small{color:var(--mute)}
.num{font-family:var(--display);font-weight:800;font-size:22px}
.exp{color:var(--fg);font-weight:600}

/* toggles */
.tg{position:relative;display:inline-flex;align-items:center;gap:10px;cursor:pointer}
.tg input{position:absolute;opacity:0;width:1px;height:1px}
.tg .sw{width:36px;height:20px;border-radius:999px;background:var(--raise);border:1px solid var(--line);position:relative;flex:none;transition:background .15s}
.tg .sw::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--mute);transition:transform .15s,background .15s}
.tg input:checked + .sw{background:var(--fg);border-color:var(--fg)}
.tg input:checked + .sw::after{transform:translateX(16px);background:var(--bg)}
.tg input:focus-visible + .sw{outline:2px solid var(--fg);outline-offset:2px}

/* editor */
.ed{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
.stack{display:grid;gap:16px}
.fgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.fgrid .w2{grid-column:span 2}
.fgrid .w3{grid-column:1/-1}
.f{display:grid;gap:6px;min-width:0}
.f label{font-size:12px;color:var(--mute);display:flex;justify-content:space-between;gap:8px}
.f input,.f select,.f textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:3px;padding:9px 11px;outline:none}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--fg)}
.f textarea{min-height:120px;resize:vertical;line-height:1.55}
.f .hint{font-size:12px;color:var(--mute)}
.langtabs{display:flex;gap:2px}
.langtabs button{background:none;border:0;padding:4px 8px;cursor:pointer;font-size:12px;font-weight:700;color:var(--mute);border-radius:2px}
.langtabs button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.langtabs button .miss{display:inline-block;width:5px;height:5px;border-radius:50%;background:currentColor;margin-left:4px;vertical-align:middle;opacity:.8}
.media{display:grid;grid-template-columns:150px repeat(4,minmax(0,1fr));gap:10px}
.slot{aspect-ratio:3/4;border-radius:3px;position:relative;overflow:hidden}
.slot.empty{border:1px dashed var(--mute);display:grid;place-items:center;text-align:center;color:var(--mute);font-size:12px;padding:8px;cursor:pointer;background:none}
.slot .lab{position:absolute;left:0;right:0;bottom:0;padding:6px 8px;font-size:11px;background:linear-gradient(transparent,rgba(0,0,0,.8))}
.media .slot:first-child{grid-row:span 2;aspect-ratio:auto}
.rows-set{display:grid;gap:14px}
.rows-set .r{display:flex;justify-content:space-between;align-items:center;gap:12px}
.rows-set .r p small{display:block;color:var(--mute);font-size:12px}
.preview{position:sticky;top:84px}
.card-prev .photo{aspect-ratio:3/4;position:relative;border-radius:2px}
.card-prev .n{position:absolute;left:10px;top:4px;font-family:var(--display);font-weight:900;font-size:3.25rem;line-height:1}
.card-prev .nm{margin-top:10px;font-family:var(--display);text-transform:uppercase;font-weight:800;font-size:1.6rem;line-height:1}
.card-prev .mt{color:var(--mute);font-size:13px;margin-top:4px}
.savebar{position:sticky;bottom:0;margin-top:20px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px;background:var(--fg);color:var(--bg);border-radius:4px}
.savebar .btn{background:var(--bg);color:var(--fg);border-color:var(--bg)}
.savebar .btn.ghost{background:none;color:var(--bg);border-color:rgba(0,0,0,.3)}

/* rich text */
.rte{border:1px solid var(--line);border-radius:3px;background:var(--bg)}
.rte .tb{display:flex;flex-wrap:wrap;gap:2px;padding:6px;border-bottom:1px solid var(--line)}
.rte .tb button{background:none;border:0;border-radius:2px;padding:4px 9px;cursor:pointer;color:var(--soft);font-size:13px;font-weight:600}
.rte .tb button:hover{background:var(--raise);color:var(--fg)}
.rte .tb .sep{width:1px;background:var(--line);margin:2px 4px}
.rte .body{padding:16px 18px;min-height:280px;outline:none;line-height:1.65;color:#e6e6e6}
.rte .body h2{font-family:var(--display);text-transform:uppercase;font-weight:800;font-size:1.75rem;margin:18px 0 6px}
.rte .body p{margin-bottom:12px}
.rte .body blockquote{margin:12px 0;padding-left:14px;border-left:3px solid var(--fg);color:var(--fg);font-weight:500}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{display:inline-flex;align-items:center;gap:6px;background:var(--raise);border-radius:3px;padding:4px 8px;font-size:13px}
.tag button{background:none;border:0;padding:0;cursor:pointer;color:var(--mute)}

/* pages editor */
.secrow{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line)}
.secrow:last-child{border-bottom:0}
.secrow .grow{flex:1;min-width:0}
.secrow .grow small{display:block;color:var(--mute);font-size:12px}

/* instagram */
.iggrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.igp{position:relative;aspect-ratio:1;border-radius:3px;overflow:hidden}
.igp .st{position:absolute;top:6px;left:6px}
.igp .ac{position:absolute;inset:auto 6px 6px 6px;display:flex;gap:4px}
.igp .ac button{flex:1;height:26px;border-radius:2px;border:0;cursor:pointer;font-size:12px;font-weight:600;background:rgba(0,0,0,.75);color:#fff}
.igp .ac button[aria-pressed="true"]{background:#fff;color:#000}
.igp.hid .photo{opacity:.25}

/* inbox */
.inbox{display:grid;grid-template-columns:340px minmax(0,1fr);border:1px solid var(--line);border-radius:4px;overflow:hidden;min-height:560px}
.ilist{border-right:1px solid var(--line);overflow:auto}
.ilist button{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:4px 10px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:14px 16px;cursor:pointer}
.ilist button:hover{background:var(--surface)}
.ilist button[aria-current="true"]{background:var(--raise)}
.ilist .u{width:8px;height:8px;border-radius:50%;background:var(--fg);margin-top:6px}
.ilist .u.read{background:none}
.ilist b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ilist time{font-size:12px;color:var(--mute)}
.ilist .s{grid-column:2/-1;font-size:13px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.idetail{padding:24px;display:flex;flex-direction:column;gap:18px;min-width:0}
.idetail h2{font-family:var(--display);text-transform:uppercase;font-weight:800;font-size:2.25rem;line-height:.95}
.idetail dl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin:0;padding:16px 0;border-block:1px solid var(--line)}
.idetail dt{font-size:12px;color:var(--mute)}
.idetail dd{margin:2px 0 0;font-weight:600;overflow-wrap:anywhere}
.idetail .msg{color:#e0e0e0;max-width:64ch;white-space:pre-line}

/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:24px}
.login .box{width:min(100%,380px);display:grid;gap:18px}
.login img{height:44px;filter:invert(1);justify-self:start}
.login h1{font-family:var(--display);text-transform:uppercase;font-weight:800;font-size:3rem;line-height:.9}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);transform:translateX(-50%) translateY(20px);background:var(--fg);color:var(--bg);padding:12px 18px;border-radius:3px;font-weight:600;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:50}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.note{font-size:12px;color:var(--mute)}

@media (max-width:1100px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .two,.ed{grid-template-columns:minmax(0,1fr)}
  .preview{position:static}
  .iggrid{grid-template-columns:repeat(4,minmax(0,1fr))}
}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;inset:0 auto 0 0;width:260px;z-index:20;background:var(--bg);transform:translateX(-100%);transition:transform .2s}
  .side.open{transform:none}
  .menu{display:inline-flex;align-items:center}
  .top{padding-left:max(16px,env(safe-area-inset-left,0px))}
  .content{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .search kbd{display:none}
  .top .btn.ghost{display:none}
  .inbox{grid-template-columns:minmax(0,1fr)}
  .ilist{border-right:0;max-height:320px}
  .fgrid{grid-template-columns:minmax(0,1fr)}
  .fgrid .w2{grid-column:auto}
  .media{grid-template-columns:repeat(3,minmax(0,1fr))}
  .media .slot:first-child{grid-row:auto;aspect-ratio:3/4}
  .iggrid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .idetail dl{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:520px){
  .kpis,.quick{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
(function(){
const players = [
  ["Arno Verbeke",1,"Goalkeeper","KAA Gent","2028-06-30","BEL"],["Moussa Ndiaye",30,"Goalkeeper","RWD Molenbeek","2027-06-30","SEN"],

  ["Yassine El Amrani",6,"Defensive midfielder","Royal Antwerp FC","2028-06-30","MAR"],["Rafael Couto",8,"Central midfielder","Vitória SC","2027-06-30","POR"],
  ["Ilyas Benali",10,"Attacking midfielder","KRC Genk","2029-06-30","BEL"],["Teo Marchetti",14,"Central midfielder","KV Mechelen","2027-06-30","ITA"],
  ["Samuel Kabongo",18,"Central midfielder","RSC Anderlecht U18","2027-06-30","COD"],["Lars Jacobs",23,"Defensive midfielder","OH Leuven","2027-06-30","BEL"],

function tone(i){
  const r=(k)=>{const x=Math.sin((i+1)*91.7+k*13.3)*43758.5;return x-Math.floor(x)};
  const a=175+Math.round(r(1)*55), b=60+Math.round(r(2)*60);
  return `--t1:rgb(${a},${a},${a});--t2:rgb(${b},${b},${b});--ang:${140+Math.round(r(3)*60)}deg`;
}

  const L = msgs.filter(m=>iFilter==="All"||m.type===iFilter);
  const m = msgs.find(x=>x.id===iSel) || L[0];
  return `
  <div class="ph"><div><h1>Messages</h1><p>Everything sent through the contact form. A copy also goes to contact@numero10.com.</p></div></div>
  <div class="tools"><div class="seg" id="iseg">${["All","Club","Player","Family","Brand","Press"].map(g=>`<button type="button" aria-pressed="${g===iFilter}" data-f="${g}">${g}</button>`).join("")}</div></div>
  <div class="inbox">
    <div class="ilist">${L.map(x=>`<button type="button" data-m="${x.id}" aria-current="${x.id===(m&&m.id)}"><span class="u ${x.read?"read":""}"></span><b>${x.from}</b><time>${x.d}</time><span class="s">${x.type}: ${x.sub}</span></button>`).join("")}</div>
    ${m?`<div class="idetail">
      <div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap"><span class="pill out">${m.type}</span><span class="note">${m.d}</span></div>
      <h2>${m.sub}</h2>
      <dl><div><dt>From</dt><dd>${m.from}</dd></div><div><dt>Organisation</dt><dd>${m.org}</dd></div><div><dt>Email</dt><dd>${m.email}</dd></div></dl>
      <p class="msg">${esc(m.msg)}</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:auto"><button class="btn pri" type="button" data-toast="Reply opened in your email">Reply by email</button><button class="btn" type="button" data-toast="Marked as handled">Mark as handled</button><button class="btn ghost" type="button" data-toast="Moved to archive">Archive</button></div>
    </div>`:`<div class="idetail"><p class="note">No messages of this type yet.</p></div>`}
  </div>`;
};

/* ---------- router ---------- */
let current = "overview";
function go(v, arg){
  current = v;
  const navKey = v==="talent"||v==="talent-new"?"talents":v==="post"?"journal":v;
  document.querySelectorAll(".side nav a").forEach(a=>{ if(a.dataset.v===navKey) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current"); });
  C.innerHTML = v==="talent-new" ? V.talent(null) : v==="talent" ? V.talent(arg) : V[v]();
  document.getElementById("side").classList.remove("open");
  window.scrollTo(0,0);
  if(v==="talent"||v==="talent-new") wireEditor(arg);
  try{ localStorage.setItem("n10-cms-view", v==="talent"?"talents":v==="talent-new"?"talents":v); }catch(e){}
}
function updateUnread(){ const n = msgs.filter(m=>!m.read).length; document.getElementById("navUnread").textContent = n? n+" new" : ""; }

function wireEditor(i){
  const name = C.querySelector("#e-name"), num = C.querySelector("#e-num"), club = C.querySelector("#e-club"), pos = C.querySelector("#e-pos");
  const sync = ()=>{ C.querySelector("#pvName").textContent = name.value || "Player name"; C.querySelector("#pvNum").textContent = num.value || "–"; C.querySelector("#pvMeta").textContent = pos.value + (club.value?", "+club.value:""); };
  [name,num,club,pos].forEach(el=>el.addEventListener("input",sync));
  const bio = C.querySelector("#e-bio"), cnt = C.querySelector("#bioCount");
  const sc = ()=> cnt.textContent = bio.value.length + " / 600"; bio.addEventListener("input",sc); sc();
  C.querySelector("#langtabs").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;edLang=b.dataset.l;go(i==null?"talent-new":"talent",i);});
}

document.addEventListener("click",e=>{
  const nav = e.target.closest(".side nav a"); if(nav){ e.preventDefault(); go(nav.dataset.v); return; }
  const t = e.target.closest("[data-toast]"); if(t) toast(t.dataset.toast);
  const g = e.target.closest("[data-go]"); if(g){ go(g.dataset.go); return; }
  const row = e.target.closest("tr[data-p]"); if(row){ edLang="EN"; go("talent", +row.dataset.p); return; }
  const seg = e.target.closest(".seg button");
  if(seg){ const id = seg.parentElement.id; if(id==="tseg"){tFilter=seg.dataset.f;go("talents");} if(id==="jseg"){jFilter=seg.dataset.f;go("journal");} if(id==="iseg"){iFilter=seg.dataset.f;const f=msgs.find(m=>iFilter==="All"||m.type===iFilter);if(f)iSel=f.id;go("inbox");} return; }
  const om = e.target.closest("[data-open-m]"); if(om){ iSel=+om.dataset.openM; iFilter="All"; msgs.find(y=>y.id===iSel).read=true; updateUnread(); go("inbox"); return; }
  const m = e.target.closest("[data-m]"); if(m){ iSel=+m.dataset.m; const x=msgs.find(y=>y.id===iSel); x.read=true; updateUnread(); go("inbox"); return; }
  const ig = e.target.closest("[data-ig]"); if(ig){ const s=igState[+ig.dataset.i]; s[ig.dataset.ig]=!s[ig.dataset.ig]; if(ig.dataset.ig==="pin"&&s.pin) s.hide=false; if(ig.dataset.ig==="hide"&&s.hide) s.pin=false; go("instagram"); return; }
  const lt = e.target.closest(".langtabs button"); if(lt && !lt.closest("#langtabs")){ lt.parentElement.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",b===lt)); }
});
C.addEventListener("change",e=>{ if(e.target.matches(".tg input")) toast(e.target.checked?"Turned on":"Turned off"); });
document.getElementById("menuBtn").addEventListener("click",()=>document.getElementById("side").classList.toggle("open"));
document.getElementById("signOut").addEventListener("click",()=>{ document.getElementById("appView").hidden=true; document.getElementById("loginView").hidden=false; });
document.getElementById("loginForm").addEventListener("submit",e=>{ e.preventDefault(); document.getElementById("loginView").hidden=true; document.getElementById("appView").hidden=false; go("overview"); });
document.addEventListener("keydown",e=>{ if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"){ e.preventDefault(); document.getElementById("q").focus(); }});

updateUnread();
let start = "overview"; try{ start = localStorage.getItem("n10-cms-view") || "overview"; }catch(e){}
if(!V[start]) start = "overview";
const h = (location.hash||"").slice(1); if(V[h]) start = h;
go(start);
})();
</script>
